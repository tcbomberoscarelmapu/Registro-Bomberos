ay:grid;place-items:center;overflow:hidden;font-size:25px;color:var(--primary-dark)}.photo-large img{width:100%;height:100%;object-fit:cover}.detail-top{display:flex;gap:20px;align-items:center;padding:20px;background:var(--primary-soft);border-radius:14px;margin-bottom:18px}.detail-top .photo-large{background:#ffffff}.detail-top h2{margin:0 0 5px;font:800 22px Manrope}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:16px 0}.tabs button{border:0;background:none;padding:11px 14px;color:var(--muted);font-weight:800;border-bottom:2px solid transparent}.tabs button.active{color:var(--primary-dark);border-color:var(--primary)}.tab-content{min-height:150px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.detail-item small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}.detail-item strong{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.toast{position:fixed;bottom:22px;right:22px;background:#193b29;color:#fff;padding:13px 18px;border-radius:11px;box-shadow:var(--shadow);z-index:50;max-width:360px}.toast.bad{background:#9f2f2f}.mobile-menu{display:none}.note{background:var(--primary-soft);padding:12px 14px;border-radius:10px;color:var(--primary-dark);font-size:12px;line-height:1.5}.mini-link{border:0;background:none;color:var(--primary-dark);font-weight:800;padding:0}.loading{opacity:.6;pointer-events:none}

/* Mejoras móviles: áreas táctiles, safe-area y formularios cómodos */
html { -webkit-text-size-adjust: 100%; }
button, .btn, select, input, textarea { touch-action: manipulation; }
button, .btn { min-height: 40px; }
.field input, .field select, .field textarea, .search-input { font-size: 16px; }
.topbar { padding-top: env(safe-area-inset-top); }
.toast { bottom: max(16px, env(safe-area-inset-bottom)); right: max(12px, env(safe-area-inset-right)); left: max(12px, env(safe-area-inset-left)); max-width: none; }
.modal-backdrop { padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.table-wrap { -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
@media(max-width:760px) {
  body { font-size: 14px; }
  .topbar { padding-left: 12px; padding-right: 12px; gap: 8px; }
  .topbar h2 { max-width: 54vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-actions { gap: 5px; }
  .theme-toggle { padding: 8px; }
  .content { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat { min-width: 0; }
  .stat-top { align-items: flex-start; gap: 5px; }
  .stat-icon { flex-shrink: 0; }
  .panel { border-radius: 12px; }
  .panel-body { padding: 13px; }
  .panel-head { padding: 14px; }
  .panel-head .search-input { width: 100%; }
  .toolbar .btn { flex: 1 1 auto; }
  .filters select { flex: 1 1 145px; min-width: 0; max-width: 100%; }
  .table-wrap table { min-width: 760px; }
  .modal { width: 100%; border-radius: 14px; }
  .modal-head h3 { font-size: 16px; }
  .modal-foot { flex-wrap: wrap; }
  .modal-foot .btn { flex: 1 1 130px; }
  .photo-upload { align-items: flex-start; flex-wrap: wrap; }
  .detail-top { flex-wrap: wrap; gap: 12px; }
  .detail-top > div { min-width: 0; }
  .detail-grid { grid-template-columns: minmax(0, 1fr); }
  .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tabs button { flex: 0 0 auto; white-space: nowrap; }
  .login-right { padding: 22px; }
  .login-card h2 { font-size: 26px; }
}
@media(max-width:380px) {
  .topbar h2 { max-width: 43vw; font-size: 14px; }

  .stat { padding: 10px; }
  .stat strong { font-size: 22px; }
  .page-head h1 { font-size: 22px; }
}
@media(hover:none) {
  .btn:hover, .nav button:hover { filter: none; }
}

<body>
<div id="app" class="app"></div>
<div id="modal-root"></div><div id="toast-root"></div>
<script>
const OPTS={
 tipos:['Bombero','Insigne','Honorario','Aspirante','Cadete o Brigadier','Otro'],
 situaciones:['Activo','No Activo','Retirado','Expulsado','Separado','Fallecido'],
 academico:['Bombero Postulante','Bombero Inicial','Bombero Operativo','Bombero Profesional','Especialidad'],
 cargos:['Sin cargo','Superintendente','Vicesuperintendente','Tesorero General','Secretario General','Ayudante General','Comandante','Inspector de Máquinas','Director','Capitán','Teniente','Secretario de Compañía','Tesorero de Compañía','Ayudante de Compañía','Jefe de Máquinas'],
 estadosMaterial:['Bueno','Regular','Malo','Dado de baja','Devuelto']
};
const state={token:'',user:null,bomberos:[],academico:[],material:[],usuarios:[],page:'dashboard',theme:localStorage.getItem('bomberos-theme')||'green',query:'',filterSituacion:'',filterTipo:'',filterCargo:'',editing:null,detail:null,detailTab:'datos'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateFmt=s=>s?new Date(String(s).length===10?s+'T12:00:00':s).toLocaleDateString('es-CL'):'—';
function api(action,data={}){return new Promise((resolve,reject)=>{if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r.data):reject(new Error(r?.error||'Error de servidor'))).withFailureHandler(e=>reject(new Error(e.message||'Error de conexión'))).api({action,token:state.token,...data});}else{reject(new Error('La aplicación no está conectada a Apps Script. Despliegue Index.html y Code.gs como aplicación web de Google Apps Script.'));}})}
function toast(msg,bad=false){$('#toast-root').innerHTML=`<div class="toast ${bad?'bad':''}">${esc(msg)}</div>`;setTimeout(()=>$('#toast-root').innerHTML='',3500)}
function initials(b){return ((b.nombres||'?').trim()[0]||'')+((b.apellidos||'').trim()[0]||'')}
function fullName(b){return `${b.nombres||''} ${b.apellidos||''}`.trim()}
function photo(b,size='avatar'){return b.fotoUrl?`<div class="${size}"><img src="${esc(b.fotoUrl)}" alt="Fotografía de ${esc(fullName(b))}"></div>`:`<div class="${size}">${esc(initials(b)||'👨‍🚒')}</div>`}
function pill(s){let c=s==='Activo'||s==='Bueno'?'':(['Retirado','Expulsado','Fallecido','Dado de baja'].includes(s)?'red':(['No Activo','Separado','Regular'].includes(s)?'amber':'gray'));return `<span class="pill ${c}">${esc(s||'Sin dato')}</span>`}
function setTheme(t){state.theme=t;localStorage.setItem('bomberos-theme',t);document.documentElement.dataset.theme=t==='blue'?'blue':'';if(state.user)render()}
function loginView(){return `<div class="login-wrap"><section class="login-art"><div><div class="brand-mark">🚒</div><h1>Registro institucional<br>de Bomberos</h1><p>Una plataforma para organizar la hoja de vida, formación, equipamiento y trayectoria de cada integrante de la Tercera Compañía de Bomberos de Carelmapu.</p></div><div style="font-size:12px;color:#d9f6e5">TERCERA COMPAÑÍA · CARELMAPU</div></section><section class="login-right"><form class="login-card" id="login-form"><div class="eyebrow">Acceso institucional</div><h2>Bienvenido</h2><p class="muted" style="margin:0 0 28px">Ingrese sus credenciales para continuar.</p><div class="field"><label>Usuario</label><input name="usuario" autocomplete="username" required placeholder="Nombre de usuario"></div><div class="field"><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required placeholder="Su contraseña"></div><div id="login-error" class="error"></div><button class="btn btn-primary full" type="submit">Iniciar sesión <span>→</span></button><p class="muted" style="font-size:11px;line-height:1.6;margin-top:20px">Sistema de acceso restringido. Si no tiene una cuenta, contacte al administrador institucional.</p></form></section></div>`}
function render(){document.documentElement.dataset.theme=state.theme==='blue'?'blue':'';if(!state.user){$('#app').innerHTML=loginView();$('#login-form').addEventListener('submit',doLogin);return}
const nav=[['dashboard','📱','Panel principal'],['bomberos','🧑‍🚒','Registro de bomberos'],['academico','📑','Historial académico'],['material','⛑️','Material a cargo'],...(state.user.rol==='Administrador'?[['usuarios','🪪','Usuarios y roles']]:[])];
$('#app').innerHTML=`<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">🧑‍🚒</div><div><strong>REGISTRO BOMBERIL</strong><small>3.ª Compañía · Carelmapu</small></div></div><div><div class="nav-label">MENÚ PRINCIPAL</div><nav class="nav">${nav.map(n=>`<button class="${state.page===n[0]?'active':''}" data-page="${n[0]}"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('')}</nav></div><div class="side-bottom"><div class="nav-label">PREFERENCIAS</div><div class="nav"><button id="theme-side"><span class="ico">◐</span>Cambiar a tema ${state.theme==='green'?'azul':'verde'}</button><button id="password-btn"><span class="ico">🔏</span>Cambiar contraseña</button></div><div class="user-mini">${photo({nombres:state.user.nombre||state.user.usuario,apellidos:''})}<div style="min-width:0"><strong>${esc(state.user.nombre||state.user.usuario)}</strong><small>${esc(state.user.rol)}</small></div></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn btn-outline mobile-menu" id="menu-btn">☰</button><div><h2>${({dashboard:'Panel principal',bomberos:'Registro general de bomberos',academico:'Historial académico',material:'Material a cargo',usuarios:'Usuarios y permisos'})[state.page]}</h2><div class="sub">Tercera Compañía de Bomberos de Carelmapu</div></div></div><div class="top-actions"><button class="theme-toggle" id="theme-top" title="Cambiar colores">${state.theme==='green'?'🟢':'🔵'} <span class="user-label">${state.theme==='green'?'Verde':'Azul'}</span></button><button class="btn btn-outline btn-sm" id="logout-btn">↪ Salir</button></div></header><section class="content">${pageContent()}</section></main></div>`;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.query='';render()});
$('#theme-side').onclick=()=>setTheme(state.theme==='green'?'blue':'green');$('#theme-top').onclick=()=>setTheme(state.theme==='green'?'blue':'green');$('#logout-btn').onclick=logout;$('#password-btn').onclick=passwordModal;
const mb=$('#menu-btn');if(mb)mb.onclick=()=>$('#sidebar').classList.toggle('open');
bindPage();
document.onkeydown=e=>{if(e.key==='Escape'){const mr=$('#modal-root');if(mr)mr.innerHTML='';const sb=$('#sidebar');if(sb)sb.classList.remove('open')}};
}
function pageContent(){
if(state.page==='dashboard')return dashboard();
if(state.page==='bomberos')return bomberosPage();
if(state.page==='academico')return recordsPage('academico');
if(state.page==='material')return recordsPage('material');
if(state.page==='usuarios')return usersPage();
return '';
}
function dashboard(){const active=state.bomberos.filter(b=>b.situacion==='Activo').length,asp=state.bomberos.filter(b=>b.tipoBombero==='Aspirante'||b.tipoBombero==='Cadete o Brigadier').length,academy=state.academico.length,assigned=state.material.filter(m=>!m.fechaDevolucion&&m.estado!=='Devuelto').length;

ass="field"><label>Categoría</label><input name="categoria" value="${esc(r.categoria||'')}" placeholder="EPP, herramienta, radio…"></div><div class="field"><label>Marca / modelo</label><input name="marcaModelo" value="${esc(r.marcaModelo||'')}"></div><div class="field"><label>Número de serie / inventario</label><input name="numeroSerie" value="${esc(r.numeroSerie||'')}"></div><div class="field"><label>Estado</label><select name="estado">${OPTS.estadosMaterial.map(x=>`<option ${r.estado===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Fecha de devolución</label><input name="fechaDevolucion" type="date" value="${esc(r.fechaDevolucion||'')}"></div><div class="field fullspan"><label>Observaciones</label><textarea name="observaciones">${esc(r.observaciones||'')}</textarea></div>`}</div><div class="error" id="form-error"></div></div><div class="modal-foot"><button type="button" class="btn btn-outline" id="cancel-modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar registro</button></div></form></div></div>`;closeModalBindings();$('#record-form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());try{await api(isA?'saveAcademico':'saveMaterial',{data:d});$('#modal-root').innerHTML='';await refresh();toast('Registro guardado')}catch(err){$('#form-error').textContent=err.message}}}

,'N.º serie','Devolución']],body:mat.map(x=>[x.fechaEntrega||'',x.material||'',x.categoria||'',x.estado||'',x.numeroSerie||'',x.fechaDevolucion||'']),styles:{fontSize:7,cellPadding:2},headStyles:{fillColor:green},showHead:'everyPage'});const pages=doc.internal.getNumberOfPages();for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text('Documento confidencial · Generado el '+new Date().toLocaleDateString('es-CL'),14,290);doc.text('Página '+i+' de '+pages,180,290)}doc.save('Hoja_de_Vida_'+fullName(b).replace(/\s+/g,'_')+'.pdf')}
